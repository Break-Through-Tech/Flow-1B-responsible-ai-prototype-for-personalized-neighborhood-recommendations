[project]
name = "flow-neighborhoods"
version = "0.1.0"
description = "Deterministic neighborhood recommendations over the team's prepared snapshot"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_neighborhoods"]

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100

