[project]
name = "flow-neighborhoods"
version = "0.1.0"
description = "Deterministic neighborhood recommendations over the team's prepared snapshot"
requires-python = ">=3.11"

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]
# Review sentiment for crowd_themes (src/nlp); google-genai only for re-tagging new text.
nlp = ["vaderSentiment>=3.3.2"]

[project.scripts]
flow-neighborhoods-mcp = "flow_neighborhoods.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_neighborhoods", "src/nlp"]

[dependency-groups]
dev = ["pytest>=8", "ruff", "mcp>=2.2,<3", "vaderSentiment>=3.3.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100

